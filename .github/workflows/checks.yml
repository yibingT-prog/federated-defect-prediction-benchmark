name: Reproducibility checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_snapshot.py
      - run: python scripts/verify_flr_publication.py
      - run: python scripts/verify_native_fedcpdp_publication.py
      - run: python scripts/verify_almity_publication.py
      - run: python scripts/verify_resource_publication.py --method ecfml
      - run: python scripts/verify_resource_publication.py --method feddp
      - run: python scripts/verify_privacy_publication.py
